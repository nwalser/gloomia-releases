name: Bug report
description: Report a bug in Gloomia
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster it can be fixed.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of what went wrong.
      placeholder: The Flight Radar wallpaper stops updating after my PC wakes from sleep.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug. Numbered lists work well.
      placeholder: |
        1. Open Gloomia
        2. Apply the Flight Radar wallpaper
        3. Let the PC sleep, then wake it
        4. The aircraft stop moving
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The wallpaper should keep running and refresh its data after wake.
    validations:
      required: true

  - type: input
    id: wallpaper
    attributes:
      label: Which wallpaper?
      description: The wallpaper that was active when the bug happened (if any).
      placeholder: e.g. Flight Radar, Aurora Flow, Starfield
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Gloomia version
      description: Open Settings → About to find your version number.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other / not sure
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware (optional)
      description: Only relevant for bugs that might depend on CPU/GPU (performance, stutter, high battery drain, GPU-heavy wallpapers, etc.).
      placeholder: e.g. Intel i7-12700K, RTX 4070, 32 GB RAM
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Attach screenshots, videos, or paste relevant log lines. Logs are at `%APPDATA%\Gloomia\logs`.
      placeholder: Drop files here, or paste text.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I'm on the latest version of Gloomia (or the bug is present on the latest).
          required: true
