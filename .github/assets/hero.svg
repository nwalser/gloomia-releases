<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14101f"/>
      <stop offset="0.55" stop-color="#0e0b18"/>
      <stop offset="1" stop-color="#080611"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34f5b0"/>
      <stop offset="0.5" stop-color="#5ec8d8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="hue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5ec8d8"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="300" height="180" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <ellipse cx="270" cy="150" rx="520" ry="360" fill="url(#glow)" opacity="0.5"/>

  <!-- Wordmark -->
  <g transform="translate(80,90)">
    <circle cx="20" cy="20" r="20" fill="#8b5cf6"/>
    <circle cx="20" cy="20" r="8" fill="#0e0b18"/>
    <text x="56" y="32" font-size="44" font-weight="700" fill="#f4f1fb">Gloomia</text>
  </g>
  <text x="82" y="168" font-size="22" fill="#b9b2cf" font-weight="400">Living wallpapers for your Windows desktop.</text>
  <text x="82" y="206" font-size="15" fill="#7c8" opacity="0.0">.</text>
  <text x="82" y="206" font-size="15" fill="#9a93b3">Starfields, auroras, neon rain, live flight radar &amp; more — animated, reactive, native.</text>

  <!-- Wallpaper tile montage -->
  <g transform="translate(80,270)">
    <!-- Starfield -->
    <g transform="translate(0,0)">
      <g clip-path="url(#card)">
        <rect width="300" height="180" fill="#05060f"/>
        <circle cx="40" cy="40" r="1.6" fill="#fff"/><circle cx="90" cy="70" r="1.1" fill="#cdd"/>
        <circle cx="150" cy="30" r="2" fill="#fff"/><circle cx="210" cy="90" r="1.3" fill="#bcd"/>
        <circle cx="260" cy="50" r="1.6" fill="#fff"/><circle cx="120" cy="120" r="1.2" fill="#fff"/>
        <circle cx="70" cy="140" r="1.5" fill="#aac"/><circle cx="240" cy="140" r="1.1" fill="#fff"/>
        <circle cx="180" cy="150" r="1.7" fill="#fff"/><circle cx="30" cy="100" r="1.2" fill="#fff"/>
      </g>
      <rect width="300" height="180" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>
      <text x="14" y="166" font-size="13" fill="#e7e3f4" font-weight="600">Starfield</text>
    </g>
    <!-- Aurora Flow -->
    <g transform="translate(320,0)">
      <g clip-path="url(#card)">
        <rect width="300" height="180" fill="#04101a"/>
        <path d="M0,120 C70,70 130,160 200,110 C250,75 280,130 300,100 L300,180 L0,180 Z" fill="url(#aurora)" opacity="0.85"/>
        <path d="M0,150 C80,110 150,180 230,140 C270,118 290,150 300,138 L300,180 L0,180 Z" fill="#34f5b0" opacity="0.25"/>
      </g>
      <rect width="300" height="180" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>
      <text x="14" y="166" font-size="13" fill="#e7e3f4" font-weight="600">Aurora Flow</text>
    </g>
    <!-- Neon Rain -->
    <g transform="translate(640,0)">
      <g clip-path="url(#card)">
        <rect width="300" height="180" fill="url(#neon)"/>
        <rect x="30" y="60" width="34" height="120" fill="#1b1450" opacity="0.7"/>
        <rect x="80" y="40" width="40" height="140" fill="#201a55" opacity="0.7"/>
        <rect x="140" y="80" width="30" height="100" fill="#1b1450" opacity="0.7"/>
        <rect x="190" y="50" width="44" height="130" fill="#241c5c" opacity="0.7"/>
        <rect x="250" y="70" width="34" height="110" fill="#1b1450" opacity="0.7"/>
        <g stroke="#41ffe0" stroke-width="1.4" opacity="0.8">
          <line x1="50" y1="10" x2="44" y2="50"/><line x1="120" y1="20" x2="112" y2="64"/>
          <line x1="180" y1="6" x2="174" y2="44"/><line x1="240" y1="24" x2="232" y2="60"/>
          <line x1="90" y1="0" x2="84" y2="36"/><line x1="210" y1="12" x2="204" y2="52"/>
        </g>
        <rect x="60" y="120" width="22" height="40" fill="#ff4d8d" opacity="0.5"/>
        <rect x="200" y="120" width="22" height="40" fill="#41ffe0" opacity="0.5"/>
      </g>
      <rect width="300" height="180" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>
      <text x="14" y="166" font-size="13" fill="#e7e3f4" font-weight="600">Neon Rain</text>
    </g>
  </g>

  <g transform="translate(80,470)">
    <!-- Planet System -->
    <g transform="translate(0,0)">
      <g clip-path="url(#card)">
        <rect width="300" height="180" fill="#070512"/>
        <ellipse cx="150" cy="90" rx="120" ry="44" fill="none" stroke="#3a2f63" stroke-width="1"/>
        <ellipse cx="150" cy="90" rx="80" ry="30" fill="none" stroke="#3a2f63" stroke-width="1"/>
        <circle cx="150" cy="90" r="16" fill="#ffcf6b"/>
        <circle cx="270" cy="90" r="6" fill="#5ec8d8"/>
        <circle cx="230" cy="64" r="4" fill="#ff9d6b"/>
        <circle cx="90" cy="112" r="5" fill="#a78bfa"/>
      </g>
      <rect width="300" height="180" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>
      <text x="14" y="166" font-size="13" fill="#e7e3f4" font-weight="600">Planet System</text>
    </g>
    <!-- Matrix Rain -->
    <g transform="translate(320,0)">
      <g clip-path="url(#card)">
        <rect width="300" height="180" fill="#020a04"/>
        <g fill="#41ff89" font-family="monospace" font-size="13">
          <text x="20" y="30">1</text><text x="20" y="50" opacity="0.7">0</text><text x="20" y="70" opacity="0.4">1</text>
          <text x="70" y="50">0</text><text x="70" y="70" opacity="0.7">1</text><text x="70" y="90" opacity="0.4">1</text>
          <text x="120" y="20">1</text><text x="120" y="40" opacity="0.7">0</text><text x="120" y="60" opacity="0.4">0</text>
          <text x="170" y="70">0</text><text x="170" y="90" opacity="0.7">1</text><text x="170" y="110" opacity="0.4">1</text>
          <text x="220" y="40">1</text><text x="220" y="60" opacity="0.7">1</text><text x="220" y="80" opacity="0.4">0</text>
          <text x="265" y="60">0</text><text x="265" y="80" opacity="0.7">1</text><text x="265" y="100" opacity="0.4">0</text>
        </g>
      </g>
      <rect width="300" height="180" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>
      <text x="14" y="166" font-size="13" fill="#e7e3f4" font-weight="600">Matrix Rain</text>
    </g>
    <!-- Hue Drift -->
    <g transform="translate(640,0)">
      <g clip-path="url(#card)">
        <rect width="300" height="180" fill="url(#hue)" opacity="0.9"/>
        <circle cx="80" cy="70" r="60" fill="#ff7ad9" opacity="0.5"/>
        <circle cx="210" cy="120" r="70" fill="#5ec8d8" opacity="0.5"/>
        <circle cx="170" cy="50" r="50" fill="#8b5cf6" opacity="0.5"/>
      </g>
      <rect width="300" height="180" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>
      <text x="14" y="166" font-size="13" fill="#fff" font-weight="600">Hue Drift</text>
    </g>
  </g>
</svg>
